<canvas id="canvas" width="1160px" height="580px"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const blockSide = 36;
const margin = 4;
const moveDist = 20;

const clearBackground = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
};

const drawEntrance = (startx, starty, block) => {
    ctx.strokeStyle = "#FF00FF";

    if (block.top === 1) {
        ctx.beginPath();
        ctx.moveTo(startx, starty);
        ctx.lineTo(startx + blockSide, starty);
        ctx.stroke();
    }

    if (block.right === 1) {
        ctx.beginPath();
        ctx.moveTo(startx + blockSide, starty);
        ctx.lineTo(startx + blockSide, starty + blockSide);
        ctx.stroke();
    }

    if (block.bottom === 1) {
        ctx.beginPath();
        ctx.moveTo(startx, starty + blockSide);
        ctx.lineTo(startx + blockSide, starty + blockSide);
        ctx.stroke();
    }

    if (block.left === 1) {
        ctx.beginPath();
        ctx.moveTo(startx, starty);
        ctx.lineTo(startx, starty + blockSide);
        ctx.stroke();
    }
}

const drawDungeonPart = (i, x, y, blocks, backgroundColor) => {
    blocks.forEach((block) => {
        const startx = x + block.x*(blockSide+margin);
        const starty = y + block.y*(blockSide+margin);
        if (backgroundColor === undefined) {
            backgroundColor = "#FFFFFF";
        }
        ctx.strokeStyle = "#FFFFFF";
        ctx.strokeRect(startx, starty, blockSide, blockSide);

        const padding = 2;
        ctx.fillStyle = backgroundColor;
        ctx.font = blockSide.toString() + "px serif"
        const textx = startx + padding;
        const texty = y + block.y*(blockSide+margin) + blockSide - padding;
        ctx.fillText(i.toString(), textx, texty, blockSide);
    });

    blocks.forEach((block) => {
        const startx = x + block.x*(blockSide+margin);
        const starty = y + block.y*(blockSide+margin);
        drawEntrance(startx, starty, block);
    });
};

const drawDungeonPieces = (x, y, dungeonPieces, dungeonData) => {
    let i = 0;
    for (const dungeonPiece of dungeonPieces) {
        const idWithoutCity = dungeonPiece.dungeonPieceId % 10000
        let dungeonPart = getDungeonPartFromId(idWithoutCity, dungeonData);

        if (dungeonPart) {
            const dungeonPieceX = (dungeonPiece.x ? dungeonPiece.x : 0);
            const dungeonPieceY = (dungeonPiece.y ? dungeonPiece.y : 0);
            const dungeonPartX = x + dungeonPieceX*(blockSide + margin);
            const dungeonPartY = y + dungeonPieceY*(blockSide + margin);

            let backgroundColor = "#FFFFFF";
            if (dungeonPart.name == "DungeonParts_Start") {
                backgroundColor = "#FF0000";
            } else if (dungeonPart.name == "DungeonParts_Boss") {
                backgroundColor = "#00FF00";
            }

            drawDungeonPart(i, dungeonPartX, dungeonPartY, dungeonPart.blocks, backgroundColor);
        } else {
            console.log("WARNING: " + idWithoutCity + " not found in dungeonParts!!!");
        }

        i += 1;
    }
}

const draw = (dungeonData, dungeonPieces, centerX, centerY, pieceIdx) => {
    clearBackground();

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "20px serif";

    const msgs = [
        "PieceIdx: " + pieceIdx,
        "Controls:",
        "a,w,s,d: Move dungeon",
        "r: Recreate dungeon",
        "q, e: -/+ PieceIdx",
        "h,j,k,l: Move piece",
        "t: Dump dungeonPieces as JSON",
        "y: Load dungeonPieces from JSON",
    ];

    for (let i = 0; i < msgs.length; ++i) {
        ctx.fillText(msgs[i], 3, 23*(i+1));
    }

    drawDungeonPieces(centerX, centerY, dungeonPieces, dungeonData);
};

const getDungeonPartFromId = (dungeonPieceId, dungeonData) => {
    for (const dungeonPart of dungeonData) {
        if (dungeonPart.id === dungeonPieceId) {
            return dungeonPart;
        }
    }

    return null;
};

const getDungeonData = () => {
    let value = document.getElementById("dungeonData").value;
    return JSON.parse(value);
};

// https://stackoverflow.com/a/64908345
const download = (content, mimeType, filename) => {
    const a = document.createElement('a') // Create "a" element
    const blob = new Blob([content], {type: mimeType}) // Create a blob (file-like object)
    const url = URL.createObjectURL(blob) // Create an object URL from blob
    a.setAttribute('href', url) // Set "a" element link
    a.setAttribute('download', filename) // Set download filename
    a.click() // Start downloading
};

const loadDungeonPieces = () => {
    return new Promise((resolve) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.setAttribute("accept", "application/json");

        input.addEventListener("change", () => {
            if (input.files.length == 1) {
                const reader = new FileReader();
                reader.addEventListener("load", () => {
                    resolve(JSON.parse(reader.result));
                    input.remove();
                });
                reader.readAsText(input.files[0]);
            }
        })

        input.click();
    });
};

const main = async () => {
    const dungeonData = getDungeonData();
    const shinagawaId = 10;
    let dungeonPieces = semba_genDungeon(dungeonData, shinagawaId);
    for (let i = 0; i < dungeonPieces.length; ++i) {
        console.log(i, dungeonPieces[i].dungeonPieceId)
    }
    let dungeonPiecesCenterX = 225;
    let dungeonPiecesCenterY = 150;
    let pieceIdx = 0;

    draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);

    document.body.addEventListener("keyup", (ev) => {
        if (ev.key == "a") {
            dungeonPiecesCenterX -= moveDist
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "d") {
            dungeonPiecesCenterX += moveDist
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "w") {
            dungeonPiecesCenterY -= moveDist
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "s") {
            dungeonPiecesCenterY += moveDist
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "r") {
            dungeonPieces = semba_genDungeon(dungeonData, shinagawaId);
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "q") {
            pieceIdx = Math.max(0, pieceIdx - 1);
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "e") {
            pieceIdx = Math.min(dungeonPieces.length - 1, pieceIdx + 1);
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "h") {
            dungeonPieces[pieceIdx].x -= 1;
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "l") {
            dungeonPieces[pieceIdx].x += 1;
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "k") {
            dungeonPieces[pieceIdx].y -= 1;
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "j") {
            dungeonPieces[pieceIdx].y += 1;
            draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
        } else if (ev.key == "t") {
            download(JSON.stringify(dungeonPieces), "application/json", "dungeonPieces.json");
        } else if (ev.key == "y") {
            loadDungeonPieces().then((data) => {
                dungeonPieces = data;
                draw(dungeonData, dungeonPieces, dungeonPiecesCenterX, dungeonPiecesCenterY, pieceIdx);
            });
        }
    });
};

main();

</script>
